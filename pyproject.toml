[project]
name = "kara"
version = "0.2.0"
description = "Local-first personal AI agent with memory, tools, scheduling, Telegram, and safety-gated desktop automation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "croniter>=6.0.0",
    "httpx>=0.28.1",
    "mcp>=1.2.0",
    "mnemosyne-memory[embeddings,mcp]>=3.14.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pymupdf>=1.26.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "python-telegram-bot>=21.0",
    "tzdata>=2025.2",
]

[project.scripts]
kara = "agent:main"
kara-gateway = "gateway.run:main"
kara-update = "update:main"
kara-install = "install_gateway:main"
kara-codex-auth = "auth.codex:main"
kara-github-auth = "auth.github:main"
